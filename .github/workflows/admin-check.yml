name: Admin 代码规范检查

on:
  push:
    paths:
      - 'resources/views/admin/**'
      - 'public/assets/admin/**'
      - 'resources/views/layouts/admin.php'
  pull_request:
    paths:
      - 'resources/views/admin/**'
      - 'public/assets/admin/**'
      - 'resources/views/layouts/admin.php'

jobs:
  admin-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 检查内联 onclick
        run: |
          if grep -rn 'onclick=' resources/views/admin/ 2>/dev/null; then
            echo "❌ 发现内联 onclick，请改用 data-* 属性 + admin.js"
            exit 1
          fi
          echo "✅ 无内联 onclick"

      - name: 检查 admin.php 内联脚本
        run: |
          if grep -q '<script>' resources/views/layouts/admin.php 2>/dev/null; then
            echo "❌ admin.php 中有内联 <script>，请移入 admin.js"
            exit 1
          fi
          echo "✅ admin.php 无内联脚本"

      - name: 检查模板 CSS 类是否已定义
        run: |
          # 更健壮的提取逻辑：先提取 class="..." 引号内内容，
          # 清理 PHP <?= ?> 和 JS 字符串拼接 ' + var + ' 的动态片段，
          # 再按空格拆词，只保留字母开头、由字母数字下划线连字符组成的纯 CSS 类名，
          # 最后去掉以 - 结尾的不完整残尾（如 badge- 残留）
          TMP_CLASSES=$(mktemp)
          grep -roh 'class="[^"]*"' resources/views/admin/ 2>/dev/null \
            | sed 's/^class="//;s/"$//' \
            | sed 's/<?=[^?]*?>//g' \
            | sed "s/'\s*+\s*[^+]*\s*+\s*'//g" \
            | tr ' ' '\n' \
            | grep -E '^[a-zA-Z][a-zA-Z0-9_-]*$' \
            | sed '/-$/d' \
            | sort -u > "$TMP_CLASSES"

          MISSING=0
          while read -r name; do
            [ -z "$name" ] && continue
            if ! grep -Eq "\.${name}([[:space:],.{]|$)" public/assets/admin/admin.css 2>/dev/null; then
              echo "⚠️  类 '$name' 在模板中使用但未在 admin.css 中定义"
              MISSING=1
            fi
          done < "$TMP_CLASSES"
          rm -f "$TMP_CLASSES"

          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi
          echo "✅ 所有 CSS 类均已定义"